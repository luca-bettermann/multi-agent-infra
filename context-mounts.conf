# context-mounts.conf — cross-agent read-only context bind mounts (source of truth).
# One line per mount:  <source-repo-abs-path>  <agent-root-abs-path>
# Target = <agent-root>/context-repos/<basename(source)>, mounted read-only.
# Consumed by mount-all-context.sh (run manually, or at boot via context-mounts.service).
# To give an agent read-only sight of another repo: add a line, then run ./mount-all-context.sh
# Absolute paths only (the boot unit runs as root, where ~ is /root).

# advei sees:
/home/luca/projects/data-stack/robolab-data-stack   /home/luca/projects/advei

# am-system sees:
/home/luca/projects/rtde/rtde-robot-control          /home/luca/projects/am-system

# lbp sees: framework + persistence + the mock sibling
/home/luca/projects/pfab/pred-fab                    /home/luca/projects/lbp
/home/luca/projects/pfab/pred-fab-nocodb             /home/luca/projects/lbp
/home/luca/projects/pfab-mock/pred-fab-mock          /home/luca/projects/lbp

# pfab (core) sees: its consumers
/home/luca/projects/lbp/learning-by-printing         /home/luca/projects/pfab
/home/luca/projects/pfab-mock/pred-fab-mock          /home/luca/projects/pfab

# pfab-mock sees: pred-fab (dep/reference) + lbp (it mirrors lbp's structure)
/home/luca/projects/pfab/pred-fab                    /home/luca/projects/pfab-mock
/home/luca/projects/lbp/learning-by-printing         /home/luca/projects/pfab-mock

# rtde sees: hardware/service repos + data stack
/home/luca/projects/am-system/calibration-script     /home/luca/projects/rtde
/home/luca/projects/am-system/camera-array           /home/luca/projects/rtde
/home/luca/projects/am-system/loadcell-system        /home/luca/projects/rtde
/home/luca/projects/am-system/wasp-extruder          /home/luca/projects/rtde
/home/luca/projects/data-stack/robolab-data-stack    /home/luca/projects/rtde

# thinker (orchestrator) sees the complex core it reasons over — prefers delegating to warm agents
/home/luca/projects/pfab/pred-fab                    /home/luca/projects/thinker
/home/luca/projects/pfab/pred-fab-nocodb             /home/luca/projects/thinker
/home/luca/projects/pfab-mock/pred-fab-mock          /home/luca/projects/thinker
/home/luca/projects/lbp/learning-by-printing         /home/luca/projects/thinker
/home/luca/projects/rtde/rtde-robot-control          /home/luca/projects/thinker
